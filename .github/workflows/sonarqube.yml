name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build, test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up JDK 21
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 21
          distribution: zulu

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Cache SonarQube Cloud packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.cache-sonar-scanner.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          New-Item -Path "${{ runner.temp }}/scanner" -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore Bullgate.Access.slnx

      # A pasta Migrations/ contem apenas arquivo gerado pelo EF Core: a
      # migration, seu Designer e o ModelSnapshot. Analisar codigo gerado
      # produz achado que nao se corrige, porque a proxima geracao o
      # reescreve. O AccessDbContextFactory.cs fica fora da pasta e segue
      # analisado.
      # O token nao e interpolado no bloco run de proposito. ${{ }} e
      # resolvido antes do shell existir, o que grava o valor literal no
      # script gerado. O scanner le SONAR_TOKEN do ambiente, declarado em
      # env: abaixo.
      # A cobertura ignora o projeto de migrations inteiro e o Program.cs do CLI.
      # Migration nao se
      # testa, e a factory de design-time so e usada pelo dotnet ef, fora do
      # runtime. O arquivo continua analisado para issues: coverage.exclusions
      # so retira da conta de cobertura. O Program.cs do CLI e apenas composicao:
      # ele monta o host e delega ao BootstrapCli, que tem cobertura propria.
      - name: Begin SonarQube analysis
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          & "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin `
            /k:"torphi-contise_bullgate-access" `
            /o:"torphi-contise" `
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" `
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" `
            /d:sonar.exclusions="src/Bullgate.Access.Migrations/Migrations/**" `
            /d:sonar.coverage.exclusions="src/Bullgate.Access.Migrations/**,src/Bullgate.Access.Cli/Program.cs"

      - name: Build
        shell: pwsh
        run: dotnet build Bullgate.Access.slnx --configuration Release --no-restore --no-incremental

      - name: Test with coverage
        shell: pwsh
        run: |
          dotnet test Bullgate.Access.slnx `
          --configuration Release `
          --no-build `
          --logger "trx" `
          --results-directory TestResults `
          --collect:"XPlat Code Coverage;Format=opencover"

      - name: End SonarQube analysis
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          & "${{ runner.temp }}/scanner/dotnet-sonarscanner" end
